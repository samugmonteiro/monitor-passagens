name: Atualizar Configuração via Issue

on:
  issues:
    types: [opened]

jobs:
  update-json:
    if: startsWith(github.event.issue.body, 'CONFIG_TRAJETO')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Atualizar trajetos.json
        run: |
          python -c "
          import os, json, re

          issue_body = '''${{ github.event.issue.body }}'''
          origem = re.search(r'ORIGEM:(.*)', issue_body).group(1).strip()
          destino = re.search(r'DESTINO:(.*)', issue_body).group(1).strip()
          ida = re.search(r'IDA:(.*)', issue_body).group(1).strip()
          volta = re.search(r'VOLTA:(.*)', issue_body).group(1).strip()
          preco = float(re.search(r'PRECO_ALVO:(.*)', issue_body).group(1).strip())

          novo_data = [{
              'id': f'{origem.lower()}-{destino.lower()}',
              'origem': origem,
              'destino': destino,
              'data_ida': ida,
              'data_volta': volta,
              'preco_alvo': preco,
              'ativo': True
          }]

          with open('trajetos.json', 'w', encoding='utf-8') as f:
              json.dump(novo_data, f, indent=2)
          "

      - name: Commit e Push do trajetos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trajetos.json
          git commit -m "Atualiza trajetos.json via Issue #${{ github.event.issue.number }}"
          git push

      - name: Fechar Issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "✅ Configuração atualizada com sucesso! O novo trajeto já está sendo monitorado."
name: Monitoramento de Passagens

on:
  schedule:
    # 03:00, 09:00, 14:00 e 20:00 (Horário de Brasília UTC-3 -> 06:00, 12:00, 17:00, 23:00 UTC)
    - cron: '0 6,12,17,23 * * *'
  workflow_dispatch: # Permite execução manual pela aba Actions

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restaurar Banco de Dados
        uses: actions/download-artifact@v4
        with:
          name: flight-db
          path: .
        continue-on-error: true

      - name: Instalar Dependências e Navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar Script Principal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar Banco de Dados Atualizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-db
          path: flight.db

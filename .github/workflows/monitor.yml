name: Monitoramento de Passagens

on:
  schedule:
    # 03:00, 09:00, 14:00 e 20:00 (Horário de Brasília UTC-3)
    - cron: '0 6,12,17,23 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restaurar Banco de Dados
        uses: actions/download-artifact@v4
        with:
          name: flight-db
          path: .
        continue-on-error: true

      - name: Garantir existência do SQLite
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('flight.db'); conn.close()"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar Banco de Dados Atualizado
        uses: actions/upload-artifact@v4
        with:
          name: flight-db
          path: flight.db

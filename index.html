<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurador - Monitor de Passagens</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #f4f6f8; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 1rem; }
    h2, h3 { color: #333; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .4rem; font-weight: bold; font-size: 0.9rem; }
    input { width: 100%; padding: .6rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: .75rem; background-color: #2da44e; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2c974b; }
    .status { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔑 Credenciais do GitHub</h2>
    <div class="form-group">
      <label>GitHub Personal Access Token (PAT):</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxx">
    </div>
    <div class="form-group">
      <label>Repositório (usuario/repo):</label>
      <input type="text" id="ghRepo" value="samugmonteiro/monitor-passagens">
    </div>
  </div>

  <div class="card">
    <h2>✈️ Configurar Trajeto de Ida e Volta</h2>
    <form id="routeForm">
      <div class="form-group">
        <label>Origem (IATA):</label>
        <input type="text" id="origem" placeholder="Ex: GRU" maxlength="3" required>
      </div>
      <div class="form-group">
        <label>Destino (IATA):</label>
        <input type="text" id="destino" placeholder="Ex: JFK" maxlength="3" required>
      </div>
      <div class="form-group">
        <label>Data de Ida:</label>
        <input type="date" id="data_ida" required>
      </div>
      <div class="form-group">
        <label>Data de Volta:</label>
        <input type="date" id="data_volta" required>
      </div>
      <div class="form-group">
        <label>Preço Alvo Total (R$):</label>
        <input type="number" id="preco_alvo" placeholder="Ex: 3500" required>
      </div>
      <button type="button" onclick="salvarNoGithub()">Salvar e Atualizar Monitoramento</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    async function salvarNoGithub() {
      const token = document.getElementById('ghToken').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const statusDiv = document.getElementById('status');

      if (!token) {
        alert("Por favor, insira o seu Token do GitHub!");
        return;
      }

      const novoTrajeto = [{
        id: `${document.getElementById('origem').value.toLowerCase()}-${document.getElementById('destino').value.toLowerCase()}`,
        origem: document.getElementById('origem').value.toUpperCase(),
        destino: document.getElementById('destino').value.toUpperCase(),
        data_ida: document.getElementById('data_ida').value,
        data_volta: document.getElementById('data_volta').value,
        preco_alvo: parseFloat(document.getElementById('preco_alvo').value),
        ativo: true
      }];

      const jsonContent = JSON.stringify(novoTrajeto, null, 2);
      statusDiv.innerHTML = "⏳ Atualizando no GitHub...";

      try {
        // 1. Pega a SHA do arquivo trajetos.json existente
        const getUrl = `https://api.github.com/repos/${repo}/contents/trajetos.json`;
        const resGet = await fetch(getUrl, {
          headers: { 'Authorization': `token ${token}` }
        });
        
        let sha = "";
        if (resGet.ok) {
          const dataGet = await resGet.json();
          sha = dataGet.sha;
        }

        // 2. Atualiza ou cria o trajetos.json no repositório
        const resPut = await fetch(getUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Atualiza trajetos via Interface Web',
            content: btoa(unescape(encodeURIComponent(jsonContent))),
            sha: sha || undefined
          })
        });

        if (resPut.ok) {
          statusDiv.style.color = "green";
          statusDiv.innerHTML = "✅ Trajeto salvo com sucesso no GitHub!";
        } else {
          throw new Error("Erro na API do GitHub. Verifique o Token ou permissões.");
        }
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerHTML = `❌ Falha ao salvar: ${err.message}`;
      }
    }
  </script>
</body>
</html>

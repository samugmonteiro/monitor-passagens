<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurador - Monitor de Passagens</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; background: #f4f6f8; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .4rem; font-weight: bold; font-size: 0.9rem; }
    input { width: 100%; padding: .6rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: .75rem; background-color: #2da44e; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2c974b; }
  </style>
</head>
<body>

  <div class="card">
    <h2>✈️ Alterar Trajeto Monitorado</h2>
    <form id="routeForm">
      <div class="form-group">
        <label>Origem (IATA):</label>
        <input type="text" id="origem" placeholder="Ex: GRU" maxlength="3" required>
      </div>
      <div class="form-group">
        <label>Destino (IATA):</label>
        <input type="text" id="destino" placeholder="Ex: JFK" maxlength="3" required>
      </div>
      <div class="form-group">
        <label>Data de Ida:</label>
        <input type="date" id="data_ida" required>
      </div>
      <div class="form-group">
        <label>Data de Volta:</label>
        <input type="date" id="data_volta" required>
      </div>
      <div class="form-group">
        <label>Preço Alvo Total (R$):</label>
        <input type="number" id="preco_alvo" placeholder="Ex: 3500" required>
      </div>
      <button type="button" onclick="enviarSolicitacao()">Atualizar Monitoramento</button>
    </form>
  </div>

  <script>
    function enviarSolicitacao() {
      const origem = document.getElementById('origem').value.toUpperCase();
      const destino = document.getElementById('destino').value.toUpperCase();
      const data_ida = document.getElementById('data_ida').value;
      const data_volta = document.getElementById('data_volta').value;
      const preco_alvo = document.getElementById('preco_alvo').value;

      if (!origem || !destino || !data_ida || !data_volta || !preco_alvo) {
        alert("Preencha todos os campos!");
        return;
      }

      const body = `CONFIG_TRAJETO\nORIGEM:${origem}\nDESTINO:${destino}\nIDA:${data_ida}\nVOLTA:${data_volta}\nPRECO_ALVO:${preco_alvo}`;
      const title = `Atualizar Trajeto: ${origem} -> ${destino}`;
      
      const issueUrl = `https://github.com/samugmonteiro/monitor-passagens/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
      
      window.open(issueUrl, '_blank');
    }
  </script>
</body>
</html>
